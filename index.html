<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Boss Timer L2</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:10px;
}

h2{
  text-align:center;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  margin:10px 0;
  background:#3b82f6;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.filter-btn{
  flex:1;
  background:#1e293b;
}

.filter-btn.active{
  background:#22c55e;
  color:#000;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,
td{
  padding:8px;
  border-bottom:1px solid #334155;
  font-size:14px;
}

th{
  background:#0f172a;
}

tr:nth-child(even){
  background:#1e293b;
}

.highlight{
  background:#22c55e !important;
  color:#000;
  font-weight:bold;
}

.small{
  font-size:12px;
  opacity:.7;
}

.status{
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-top:8px;
}

.status.ok{
  color:#22c55e;
}

.status.error{
  color:#ef4444;
}

.status.loading{
  color:#facc15;
}

#loginBox input{
  box-sizing:border-box;
}

</style>

</head>


<body onclick="unlockSound()">


<!-- =====================================================
     LOGIN
====================================================== -->

<div id="loginBox"
     style="
       max-width:400px;
       margin:80px auto;
       padding:20px;
       background:#1e293b;
       border-radius:10px;
     ">

  <h2>🔐 Boss Timer Login</h2>

  <input
    id="password"
    type="password"
    placeholder="Mật khẩu"
    style="
      width:100%;
      padding:10px;
      border-radius:8px;
      border:none;
      box-sizing:border-box;
    "
  >

  <button onclick="login()">
    Đăng nhập
  </button>

</div>


<!-- =====================================================
     APP
====================================================== -->

<div id="app"
     style="display:none;">

  <h2>
    🔥 Boss Timer (L2)
  </h2>


  <!-- TEST SOUND -->

  <button onclick="unlockSound(); playSound('l2')">
    🔊 Test Sound
  </button>


  <!-- FILTER -->

  <div class="filters">

    <button
      class="filter-btn active"
      id="btnL2"
      onclick="toggleSource('L2')">

      ✓ L2

    </button>

  </div>


  <!-- API STATUS -->

  <div
    id="apiStatus"
    class="status loading">

    Đang kết nối API...

  </div>


  <!-- TABLE -->

  <table>

    <thead>

      <tr>

        <th>Boss</th>

        <th>Map</th>

        <th>Time</th>

        <th>Server</th>

      </tr>

    </thead>

    <tbody id="tb"></tbody>

  </table>


  <!-- RECOMMENDATION -->

  <div id="recommendBox"
       style="
         margin-top:15px;
         padding:15px;
         background:#1e293b;
         border-radius:10px;
         display:none;
       ">
  </div>

</div>


<script>


/* =====================================================
   API
====================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbys5ufugbDaLVpml9P1ukfbUo18-iKzciB5mtZ0CRFNf-ZcxQk-sqZ-cfePo9zkABA1Nw/exec";


let TOKEN =
  localStorage.getItem("bossToken") || "";


/*
 * API chỉ được chờ tối đa 5 giây.
 *
 * Nếu API treo:
 * request sẽ bị hủy.
 *
 * Dữ liệu cũ KHÔNG bị xóa.
 */

const API_TIMEOUT = 5000;


/* =====================================================
   STATE
====================================================== */

let currentData = [];


let visibleSources = {
  L2:true
};


let lastAlert =
  new Set();


let lastMultiAlert =
  new Set();


let lastMultiTime =
  0;


let soundUnlocked =
  false;


let lastPlay =
  0;


let apiSyncing =
  false;


/* =====================================================
   SOUND
====================================================== */

const SOUNDS = {

  l2:
    new Audio("sounds/l2.mp3"),

  l2_invasion:
    new Audio("sounds/l2_invasion.mp3"),

  multi:
    new Audio("sounds/multi.mp3")

};


/* =====================================================
   UNLOCK SOUND
====================================================== */

function unlockSound(){

  if(soundUnlocked)
    return;


  Object.values(SOUNDS)
    .forEach(sound => {

      sound
        .play()
        .then(() => {

          sound.pause();

          sound.currentTime = 0;

        })
        .catch(() => {});

    });


  soundUnlocked = true;

}


/* =====================================================
   SOUND ANTI SPAM
====================================================== */

function canPlay(){

  const now =
    Date.now();


  if(
    now - lastPlay < 2000
  ){

    return false;

  }


  lastPlay =
    now;


  return true;

}


/* =====================================================
   PLAY SOUND
====================================================== */

function playSound(type){

  console.log(
    "PLAY REQUEST:",
    type,
    new Date()
      .toLocaleTimeString(),
    "hidden:",
    document.hidden
  );


  if(!canPlay())
    return;


  unlockSound();


  const audio =
    SOUNDS[type];


  if(!audio)
    return;


  audio.pause();

  audio.currentTime =
    0;


  audio
    .play()
    .then(() => {

      console.log(
        "PLAY OK:",
        type
      );

    })
    .catch(err => {

      console.error(
        "PLAY FAIL:",
        type,
        err
      );

    });

}


/* =====================================================
   LOGIN
====================================================== */

async function login(){

  try{

    const password =
      document
        .getElementById("password")
        .value;


    if(!password){

      alert(
        "Vui lòng nhập mật khẩu"
      );

      return;

    }


    const res =
      await fetchWithTimeout(

        API,

        {

          method:"POST",

          body:JSON.stringify({

            action:"login",

            password:password

          })

        },

        API_TIMEOUT

      );


    const json =
      await res.json();


    if(!json.success){

      alert(
        "Sai mật khẩu"
      );

      return;

    }


    TOKEN =
      json.token;


    localStorage.setItem(
      "bossToken",
      TOKEN
    );


    showApp();


  }catch(err){

    console.error(
      "LOGIN ERROR:",
      err
    );


    alert(
      "Không thể kết nối API"
    );

  }

}


/* =====================================================
   SHOW APP
====================================================== */

function showApp(){

  document
    .getElementById("loginBox")
    .style.display =
      "none";


  document
    .getElementById("app")
    .style.display =
      "block";


  unlockSound();


  /*
   * Lấy dữ liệu lần đầu.
   */
  syncAPI();

}


/* =====================================================
   FETCH TIMEOUT
====================================================== */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 5000
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(

      () =>
        controller.abort(),

      timeout

    );


  try{

    return await fetch(

      url,

      {

        ...options,

        signal:
          controller.signal

      }

    );

  }finally{

    clearTimeout(timer);

  }

}


/* =====================================================
   GET BOSS TIMESTAMP
====================================================== */

function getBossTimestamp(row){

  const check =
    row["check"];


  if(!check)
    return null;


  const parts =
    check
      .trim()
      .split(" ");


  if(
    parts.length < 2
  ){

    return null;

  }


  const datePart =
    parts[0];


  const timePart =
    parts[1];


  const date =
    datePart
      .split("/")
      .map(Number);


  const time =
    timePart
      .split(":")
      .map(Number);


  if(
    date.length < 3
  ){

    return null;

  }


  if(
    time.length < 2
  ){

    return null;

  }


  const day =
    date[0];


  const month =
    date[1];


  const year =
    date[2];


  const hour =
    time[0];


  const minute =
    time[1];


  const second =
    time[2] || 0;


  const timestamp =
    new Date(

      year,

      month - 1,

      day,

      hour,

      minute,

      second

    ).getTime();


  if(
    Number.isNaN(timestamp)
  ){

    return null;

  }


  return timestamp;

}


/* =====================================================
   CURRENT MINUTES
====================================================== */

function getCurrentMinutes(item){

  if(
    !item.bossTimestamp
  ){

    return 999999;

  }


  return (

    item.bossTimestamp
    -
    Date.now()

  ) / 60000;

}


/* =====================================================
   CLEAN BOSS NAME
====================================================== */

function normalizeBoss(b){

  return (b || "")
    .replace(" - K9","")
    .trim();

}


/* =====================================================
   INVASION BOSS
====================================================== */

function isInvasionBoss(name){

  return (name || "")
    .trim()
    .startsWith("XL-");

}


/* =====================================================
   TIME BOSS
====================================================== */

function getTimeBoss(row){

  const value =

    row["TIME BOSS"]

    || row["TIMEBOSS"]

    || row["TIME"]

    || row[""];


  if(

    value &&

    /^\d{1,2}:\d{2}:\d{2}$/
      .test(value)

  ){

    return value;

  }


  return null;

}


/* =====================================================
   API STATUS
====================================================== */

function setAPIStatus(
  text,
  type
){

  const box =
    document.getElementById(
      "apiStatus"
    );


  box.innerText =
    text;


  box.className =
    "status " +
    (type || "");

}


/* =====================================================
   FETCH DATA
====================================================== */

async function fetchData(){

  if(!TOKEN){

    return [];

  }


  const res =
    await fetchWithTimeout(

      API,

      {

        method:"POST",

        body:JSON.stringify({

          action:"boss",

          token:TOKEN

        })

      },

      API_TIMEOUT

    );


  const json =
    await res.json();


  if(!json.success){

    if(

      json.message ===
      "invalid token"

      ||

      json.message ===
      "token expired"

    ){

      localStorage.removeItem(
        "bossToken"
      );


      TOKEN =
        "";


      location.reload();


      return [];

    }


    throw new Error(

      json.message ||
      "API error"

    );

  }


  const l2 =
    json.data.L2 || [];


  const data = [];


  l2.forEach(row => {

    const timeBoss =
      getTimeBoss(row);


    const bossTimestamp =
      getBossTimestamp(row);

    if(
      !bossTimestamp
    ){

      return;

    }


    if(

      timeBoss &&

      !timeBoss.includes("#")

    ){

      data.push({

        boss:
          normalizeBoss(
            row.BOSS
          ),

        isInvasion:
          isInvasionBoss(
            row.BOSS
          ),

        map:
          row.MAP || "",

        time:
          timeBoss,

        src:
          "L2",

        sheet:
          "L2",

        bossTimestamp:
          bossTimestamp

      });

    }

  });


  return data;

}


/* =====================================================
   SYNC API
====================================================== */

async function syncAPI(){

  if(
    apiSyncing
  ){

    return;

  }


  apiSyncing =
    true;


  try{

    setAPIStatus(
      "🔄 Đang đồng bộ API...",
      "loading"
    );


    const data =
      await fetchData();

    if(
      Array.isArray(data)
    ){

      currentData =
        data;

    }


    setAPIStatus(

      "🟢 API OK • " +
      new Date()
        .toLocaleTimeString(),

      "ok"

    );

    renderCurrentData();


  }catch(err){

    console.error(
      "API SYNC ERROR:",
      err
    );

    setAPIStatus(

      "🔴 API lỗi • đang dùng dữ liệu cũ",

      "error"

    );

    renderCurrentData();


  }finally{

    apiSyncing =
      false;

  }

}


/* =====================================================
   FILTER
====================================================== */

function toggleSource(src){

  visibleSources[src] =
    !visibleSources[src];


  const btn =
    document.getElementById(
      "btn" + src
    );


  btn.classList.toggle(
    "active",
    visibleSources[src]
  );


  btn.innerText =

    (

      visibleSources[src]
        ? "✓ "
        : "✕ "

    ) + src;


  renderCurrentData();

}


/* =====================================================
   LOCAL COUNTDOWN
====================================================== */

function updateLocalTime(){

  if(
    !currentData.length
  ){

    return;

  }


  currentData.forEach(item => {

    item.min =
      getCurrentMinutes(
        item
      );

  });


  renderCurrentData();

}


/* =====================================================
   RECOMMENDATION
====================================================== */

function renderRecommendation(
  data
){

  const box =
    document.getElementById(
      "recommendBox"
    );


  const future =

    data

      .filter(item => {

        return (

          visibleSources[
            item.sheet
          ]

          &&

          item.min > 30

        );

      })

      .sort(
        (a,b) =>
          a.min - b.min
      );


  if(
    future.length === 0
  ){

    box.style.display =
      "none";

    return;

  }


  const clusters = [];

  let current = [];


  future.forEach(item => {

    if(
      current.length === 0
    ){

      current.push(
        item
      );

      return;

    }


    const prev =
      current[
        current.length - 1
      ];


    if(

      Math.abs(
        prev.min -
        item.min
      ) <= 2

    ){

      current.push(
        item
      );

    }else{

      clusters.push(
        current
      );

      current = [
        item
      ];

    }

  });


  if(
    current.length
  ){

    clusters.push(
      current
    );

  }


  const html =

    clusters

      .slice(0,5)

      .map(cluster => {

        const first =
          cluster[0];


        return `

          <div style="
            margin-bottom:16px;
            padding-bottom:12px;
            border-bottom:1px solid #334155;
          ">

            <div style="
              color:#22c55e;
              font-weight:bold;
              margin-bottom:8px;
            ">

              🕘 ${first.time}

              • ${cluster.length} boss

            </div>


            ${cluster
              .map(item => `

                <div>

                  • ${item.boss}

                  <span
                    style="opacity:.7">

                    (L2)

                  </span>

                </div>

              `)
              .join("")
            }


            <div
              class="small"
              style="margin-top:6px">

              Còn
              ${Math.max(
                0,
                Math.floor(
                  first.min
                )
              )}
              phút

            </div>

          </div>

        `;

      })

      .join("");


  box.style.display =
    "block";


  box.innerHTML = `

    <h3 style="margin-top:0">

      📅 Các đợt boss tiếp theo

    </h3>

    ${html}

  `;

}


/* =====================================================
   RENDER
====================================================== */

function render(data){

  const tb =
    document.getElementById(
      "tb"
    );

  data.forEach(item => {

    item.min =
      getCurrentMinutes(
        item
      );

  });


  const sorted =

    [...data]

      .sort(
        (a,b) =>
          a.min - b.min
      );


  const filtered =

    sorted.filter(item => {

      if(
        !visibleSources[
          item.sheet
        ]
      ){

        return false;

      }


      return (

        item.min <= 30

        &&

        item.min >= -1

      );

    });


  tb.innerHTML =
    "";


  /* =================================================
     TABLE
  ================================================= */

  filtered.forEach(item => {

    const tr =
      document.createElement(
        "tr"
      );


    if(
      item.min <= 1
    ){

      tr.classList.add(
        "highlight"
      );

    }


    tr.innerHTML = `

      <td>
        ${item.boss}
      </td>

      <td>
        ${item.map}
      </td>

      <td>

        ${item.time}

        <div class="small">

          ${Math.floor(
            item.min
          )}
          phút

        </div>

      </td>

      <td>
        ${item.src}
      </td>

    `;


    tb.appendChild(tr);

  });


  /* =================================================
     READY
  ================================================= */

  const ready =

    filtered.filter(
      item =>
        item.min <= 1
    );


  if(
    ready.length
  ){

    console.log(
      "READY BOSSES:",
      ready
    );

  }


  /* =================================================
     CLUSTER
  ================================================= */

  const clusters = [];

  let current = [];


  for(
    let i = 0;
    i < filtered.length;
    i++
  ){

    if(
      current.length === 0
    ){

      current.push(
        filtered[i]
      );

      continue;

    }


    const prev =
      current[
        current.length - 1
      ];


    if(

      Math.abs(
        filtered[i].min -
        prev.min
      ) <= 2

    ){

      current.push(
        filtered[i]
      );

    }else{

      clusters.push(
        current
      );


      current = [
        filtered[i]
      ];

    }

  }


  if(
    current.length
  ){

    clusters.push(
      current
    );

  }


  /* =================================================
     MULTI
  ================================================= */

  const activeMulti =

    clusters.find(cluster => {

      return (

        cluster.length >= 2

        &&

        cluster.some(
          item =>
            item.min <= 1
        )

      );

    });


  if(
    activeMulti
  ){

    console.log(
      "MULTI:",
      activeMulti
    );


    const multiKey =

      activeMulti

        .map(item =>

          item.sheet +
          "|" +
          item.boss +
          "|" +
          item.time

        )

        .sort()

        .join("||");


    const now =
      Date.now();


    if(

      !lastMultiAlert.has(
        multiKey
      )

      &&

      now -
      lastMultiTime >
      10000

    ){

      playSound(
        "multi"
      );


      lastMultiTime =
        now;


      lastMultiAlert.add(
        multiKey
      );


      activeMulti.forEach(
        item => {

          lastAlert.add(

            item.sheet +
            "|" +
            item.boss +
            "|" +
            item.time

          );

        }
      );

    }


  }else{


    /* =================================================
       SINGLE
    ================================================= */

    ready.forEach(item => {

      const key =

        item.sheet +
        "|" +
        item.boss +
        "|" +
        item.time;


      if(
        lastAlert.has(key)
      ){

        return;

      }


      lastAlert.add(
        key
      );


      if(
        item.isInvasion
      ){

        playSound(
          "l2_invasion"
        );

      }else{

        playSound(
          "l2"
        );

      }

    });

  }


  /* =================================================
     RECOMMENDATION
  ================================================= */

  renderRecommendation(
    data
  );


  /* =================================================
     EMPTY
  ================================================= */

  if(
    filtered.length === 0
  ){

    tb.innerHTML = `

      <tr>

        <td
          colspan="4"
          style="
            text-align:center;
            opacity:.6;
          "
        >

          Không có boss nào
          trong 30 phút tới

        </td>

      </tr>

    `;

  }

}


/* =====================================================
   RENDER CURRENT DATA
====================================================== */

function renderCurrentData(){

  if(
    !currentData.length
  ){

    return;

  }


  render(
    currentData
  );

}


/* =====================================================
   LOCAL COUNTDOWN - 1 SECOND
====================================================== */

setInterval(() => {

  updateLocalTime();

},1000);


/* =====================================================
   WORKER
====================================================== */

const worker =
  new Worker(
    "timer-worker.js"
  );


worker.onmessage =
  async (e) => {

    if(
      e.data.type === "tick"
    ){

      console.log(
        "worker tick:",
        new Date()
          .toLocaleTimeString()
      );

      await syncAPI();

    }

  };


worker.postMessage(
  "start"
);


/* =====================================================
   VISIBILITY CHANGE
====================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    console.log(
      "visibility:",
      document.hidden
    );


    if(
      !document.hidden
    ){

      updateLocalTime();

      syncAPI();

    }

  }
);


/* =====================================================
   AUTO LOGIN
====================================================== */

if(TOKEN){

  showApp();

}

console.log(
  "Boss Timer L2 loaded"
);

</script>

</body>

</html>
