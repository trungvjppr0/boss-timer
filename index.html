<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<style>

th,

.status{

}

  width:100%;
  padding:10px;

  border-radius:8px;

  color:#111;

.external-select{
  width:100%;

  border:none;

  box-sizing:border-box;

}

.external-label{
  display:block;

}

.external-server{

.external-server-header{

}

}

.external-actions{

}

  width:auto;

}

.btn-danger{

}

.btn-secondary{

}

.mapping-preview{

  background:#1e293b;

}

</style>

</head>


<body onclick="unlockSound()">


<!-- =====================================================
     LOGIN
====================================================== -->

<div id="loginBox"
     style="
       max-width:400px;
       margin:80px auto;
       padding:20px;
       background:#1e293b;
       border-radius:10px;
     ">

  <h2>🔐 Boss Timer Login</h2>

  <input
    id="password"
    type="password"
    placeholder="Mật khẩu"
    style="
      width:100%;
      padding:10px;
      border-radius:8px;
      border:none;
      box-sizing:border-box;
    "
  >

  <button onclick="login()">
    Đăng nhập
  </button>

</div>


<!-- =====================================================
     APP
====================================================== -->

<div id="app"
     style="display:none;">

  <h2>
    🔥 Boss Timer (L2)
  </h2>


  <!-- TEST SOUND -->

  <button onclick="unlockSound(); playSound('l2')">
    🔊 Test Sound
  </button>


  <!-- FILTER -->

  <div
    class="filters"
    id="sourceFilters">

    <button
      class="filter-btn active"
      id="btnL2"
      onclick="toggleSource('L2')">

      ✓ L2

    </button>

  </div>


  <!-- API STATUS -->

  <div
    id="apiStatus"
    class="status loading">

    Đang kết nối API...

  </div>


  <!-- TABLE -->

  <table>

    <thead>

      <tr>

        <th>Boss</th>

        <th>Map</th>

        <th>Time</th>

        <th>Server</th>

      </tr>

    </thead>

    <tbody id="tb"></tbody>

  </table>


  <!-- RECOMMENDATION -->

  <div id="recommendBox"
       style="
         margin-top:15px;
         padding:15px;
         background:#1e293b;
         border-radius:10px;
         display:none;
       ">
  </div>


  <!-- =================================================
       EXTERNAL SHEET BOX
  ================================================== -->

  <div
    id="externalSheetBox"
    class="external-box">

    <h3>
      🌐 Thêm Server / Google Sheet
    </h3>

    <div class="small">

      Dán link Google Sheet và chọn Tab.
      Sau khi đọc Sheet, bạn tự chọn cột Boss,
      Map và Time.

    </div>


    <label class="external-label">
      🔗 Link Google Sheet
    </label>

    <input
      id="externalSheetUrl"
      class="external-input"
      type="text"
      placeholder="https://docs.google.com/spreadsheets/d/..."
    >


    <label class="external-label">
      📑 Thứ tự Tab hoặc tên Tab
    </label>

    <input
      id="externalSheetTab"
      class="external-input"
      type="text"
      placeholder="Ví dụ: 1 hoặc Boss"
    >


    <button
      onclick="previewExternalSheet()">

      🔍 Đọc Sheet

    </button>


    <!-- MAPPING -->

    <div
      id="externalMappingBox"
      class="mapping-box"
      style="display:none;">

    </div>


    <!-- CONNECTED SERVERS -->

    <div
      id="externalServers"
      style="margin-top:15px;">

    </div>

  </div>

</div>


<script>


/* =====================================================
   API
====================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbys5ufugbDaLVpml9P1ukfbUo18-iKzciB5mtZ0CRFNf-ZcxQk-sqZ-cfePo9zkABA1Nw/exec";


let TOKEN =
  localStorage.getItem("bossToken") || "";


const API_TIMEOUT = 5000;


/* =====================================================
   STATE
====================================================== */

let currentData = [];

let externalData = [];

let visibleSources = {
  L2:true
};

let lastAlert =
  new Set();

let lastMultiAlert =
  new Set();

let lastMultiTime =
  0;

let soundUnlocked =
  false;

let lastPlay =
  0;

let apiSyncing =
  false;


/* =====================================================
   EXTERNAL SHEET STORAGE
====================================================== */

const EXTERNAL_STORAGE_KEY =
  "bossTimerExternalSheets";


let externalSheets =
  JSON.parse(
    localStorage.getItem(
      EXTERNAL_STORAGE_KEY
    ) || "[]"
  );


/* =====================================================
   TEMP SHEET PREVIEW
====================================================== */

let pendingExternalSheet =
  null;


/* =====================================================
   SOUND
====================================================== */

const SOUNDS = {

  l2:
    new Audio("sounds/l2.mp3"),

  l2_invasion:
    new Audio("sounds/l2_invasion.mp3"),

  multi:
    new Audio("sounds/multi.mp3")

};


/* =====================================================
   UNLOCK SOUND
====================================================== */

function unlockSound(){

  if(soundUnlocked)
    return;


  Object.values(SOUNDS)
    .forEach(sound => {

      sound
        .play()
        .then(() => {

          sound.pause();

          sound.currentTime = 0;

        })
        .catch(() => {});

    });


  soundUnlocked = true;

}


/* =====================================================
   SOUND ANTI SPAM
====================================================== */

function canPlay(){

  const now =
    Date.now();


  if(
    now - lastPlay < 2000
  ){

    return false;

  }


  lastPlay =
    now;


  return true;

}


/* =====================================================
   PLAY SOUND
====================================================== */

function playSound(type){

  console.log(
    "PLAY REQUEST:",
    type,
    new Date()
      .toLocaleTimeString(),
    "hidden:",
    document.hidden
  );


  if(!canPlay())
    return;


  unlockSound();


  const audio =
    SOUNDS[type];


  if(!audio)
    return;


  audio.pause();

  audio.currentTime =
    0;


  audio
    .play()
    .then(() => {

      console.log(
        "PLAY OK:",
        type
      );

    })
    .catch(err => {

      console.error(
        "PLAY FAIL:",
        type,
        err
      );

    });

}


/* =====================================================
   LOGIN
====================================================== */

async function login(){

  try{

    const password =
      document
        .getElementById("password")
        .value;


    if(!password){

      alert(
        "Vui lòng nhập mật khẩu"
      );

      return;

    }


    const res =
      await fetchWithTimeout(

        API,

        {

          method:"POST",

          body:JSON.stringify({

            action:"login",

            password:password

          })

        },

        API_TIMEOUT

      );


    const json =
      await res.json();


    if(!json.success){

      alert(
        "Sai mật khẩu"
      );

      return;

    }


    TOKEN =
      json.token;


    localStorage.setItem(
      "bossToken",
      TOKEN
    );


    showApp();


  }catch(err){

    console.error(
      "LOGIN ERROR:",
      err
    );


    alert(
      "Không thể kết nối API"
    );

  }

}


/* =====================================================
   SHOW APP
====================================================== */

function showApp(){

  document
    .getElementById("loginBox")
    .style.display =
      "none";


  document
    .getElementById("app")
    .style.display =
      "block";


  unlockSound();


  renderExternalServers();


  syncAPI();


  loadAllExternalSheets();

}


/* =====================================================
   FETCH TIMEOUT
====================================================== */

async function fetchWithTimeout(
  url,
  options = {},
  timeout = 5000
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(

      () =>
        controller.abort(),

      timeout

    );


  try{

    return await fetch(

      url,

      {

        ...options,

        signal:
          controller.signal

      }

    );

  }finally{

    clearTimeout(timer);

  }

}


/* =====================================================
   GET BOSS TIMESTAMP - L2
====================================================== */

function getBossTimestamp(row){

  const check =
    row["check"];


  if(!check)
    return null;


  const parts =
    check
      .trim()
      .split(" ");


  if(
    parts.length < 2
  ){

    return null;

  }


  const datePart =
    parts[0];


  const timePart =
    parts[1];


  const date =
    datePart
      .split("/")
      .map(Number);


  const time =
    timePart
      .split(":")
      .map(Number);


  if(
    date.length < 3
  ){

    return null;

  }


  if(
    time.length < 2
  ){

    return null;

  }


  const day =
    date[0];


  const month =
    date[1];


  const year =
    date[2];


  const hour =
    time[0];


  const minute =
    time[1];


  const second =
    time[2] || 0;


  const timestamp =
    new Date(

      year,

      month - 1,

      day,

      hour,

      minute,

      second

    ).getTime();


  if(
    Number.isNaN(timestamp)
  ){

    return null;

  }


  return timestamp;

}


/* =====================================================
   CURRENT MINUTES
====================================================== */

function getCurrentMinutes(item){

  if(
    !item.bossTimestamp
  ){

    return 999999;

  }


  return (

    item.bossTimestamp
    -
    Date.now()

  ) / 60000;

}


/* =====================================================
   CLEAN BOSS NAME
====================================================== */

function normalizeBoss(b){

  return (b || "")
    .replace(" - K9","")
    .trim();

}


/* =====================================================
   INVASION BOSS
====================================================== */

function isInvasionBoss(name){

  return (name || "")
    .trim()
    .startsWith("XL-");

}


/* =====================================================
   TIME BOSS - L2
====================================================== */

function getTimeBoss(row){

  const value =

    row["TIME BOSS"]

    || row["TIMEBOSS"]

    || row["TIME"]

    || row[""];


  if(

    value &&

    (
      /^\d{1,2}:\d{2}:\d{2}$/
        .test(value)

      ||

      /^\d{1,2}:\d{2}$/
        .test(value)
    )

  ){

    return value;

  }


  return null;

}


/* =====================================================
   API STATUS
====================================================== */

function setAPIStatus(
  text,
  type
){

  const box =
    document.getElementById(
      "apiStatus"
    );


  box.innerText =
    text;


  box.className =
    "status " +
    (type || "");

}


/* =====================================================
   FETCH L2 DATA
====================================================== */

async function fetchData(){

  if(!TOKEN){

    return [];

  }


  const res =
    await fetchWithTimeout(

      API,

      {

        method:"POST",

        body:JSON.stringify({

          action:"boss",

          token:TOKEN

        })

      },

      API_TIMEOUT

    );


  const json =
    await res.json();


  if(!json.success){

    if(

      json.message ===
      "invalid token"

      ||

      json.message ===
      "token expired"

    ){

      localStorage.removeItem(
        "bossToken"
      );


      TOKEN =
        "";


      location.reload();


      return [];

    }


    throw new Error(

      json.message ||
      "API error"

    );

  }


  const l2 =
    json.data.L2 || [];


  const data = [];


  l2.forEach(row => {

    const timeBoss =
      getTimeBoss(row);


    const bossTimestamp =
      getBossTimestamp(row);


    if(
      !bossTimestamp
    ){

      return;

    }


    if(

      timeBoss &&

      !timeBoss.includes("#")

    ){

      data.push({

        boss:
          normalizeBoss(
            row.BOSS
          ),

        isInvasion:
          isInvasionBoss(
            row.BOSS
          ),

        map:
          row.MAP || "",

        time:
          timeBoss,

        src:
          "L2",

        sheet:
          "L2",

        server:
          "L2",

        bossTimestamp:
          bossTimestamp

      });

    }

  });


  return data;

}


/* =====================================================
   SYNC API
====================================================== */

async function syncAPI(){

  if(
    apiSyncing
  ){

    return;

  }


  apiSyncing =
    true;


  try{

    setAPIStatus(
      "🔄 Đang đồng bộ API...",
      "loading"
    );


    const data =
      await fetchData();


    if(
      Array.isArray(data)
    ){

      currentData =
        data;

    }


    setAPIStatus(

      "🟢 API OK • " +
      new Date()
        .toLocaleTimeString(),

      "ok"

    );


    renderCurrentData();


  }catch(err){

    console.error(
      "API SYNC ERROR:",
      err
    );


    setAPIStatus(

      "🔴 API lỗi • đang dùng dữ liệu cũ",

      "error"

    );


    renderCurrentData();


  }finally{

    apiSyncing =
      false;

  }

}


/* =====================================================
   FILTER
====================================================== */

function toggleSource(src){

  visibleSources[src] =
    !visibleSources[src];


  const btn =
    document.getElementById(
      "btnSource_" +
      sourceId(src)
    );


  if(btn){

    btn.classList.toggle(
      "active",
      visibleSources[src]
    );


    btn.innerText =

      (
        visibleSources[src]
          ? "✓ "
          : "✕ "
      ) + src;

  }


  renderCurrentData();

}


/* =====================================================
   SOURCE ID
====================================================== */

function sourceId(name){

  return String(name || "")
    .replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );

}


/* =====================================================
   ADD FILTER BUTTON
====================================================== */

function addSourceFilter(
  source
){

  if(
    visibleSources[source] === undefined
  ){

    visibleSources[source] =
      true;

  }


  const container =
    document.getElementById(
      "sourceFilters"
    );


  const id =
    "btnSource_" +
    sourceId(source);


  if(
    document.getElementById(id)
  ){

    return;

  }


  const btn =
    document.createElement(
      "button"
    );


  btn.id =
    id;


  btn.className =
    "filter-btn active";


  btn.innerText =
    "✓ " + source;


  btn.onclick =
    () =>
      toggleSource(source);


  container.appendChild(
    btn
  );

}


/* =====================================================
   REMOVE FILTER BUTTON
====================================================== */

function removeSourceFilter(
  source
){

  const btn =
    document.getElementById(
      "btnSource_" +
      sourceId(source)
    );


  if(btn){

    btn.remove();

  }


  delete visibleSources[
    source
  ];

}


/* =====================================================
   LOCAL COUNTDOWN
====================================================== */

function updateLocalTime(){

  if(
    !currentData.length &&
    !externalData.length
  ){

    return;

  }


  [
    ...currentData,
    ...externalData
  ].forEach(item => {

    item.min =
      getCurrentMinutes(
        item
      );

  });


  renderCurrentData();

}


/* =====================================================
   RECOMMENDATION
====================================================== */

function renderRecommendation(
  data
){

  const box =
    document.getElementById(
      "recommendBox"
    );


  const future =

    data

      .filter(item => {

        return (

          visibleSources[
            item.sheet
          ]

          &&

          item.min > 30

        );

      })

      .sort(
        (a,b) =>
          a.min - b.min
      );


  if(
    future.length === 0
  ){

    box.style.display =
      "none";

    return;

  }


  const clusters = [];

  let current = [];


  future.forEach(item => {

    if(
      current.length === 0
    ){

      current.push(
        item
      );

      return;

    }


    const prev =
      current[
        current.length - 1
      ];


    if(

      Math.abs(
        prev.min -
        item.min
      ) <= 2

    ){

      current.push(
        item
      );

    }else{

      clusters.push(
        current
      );

      current = [
        item
      ];

    }

  });


  if(
    current.length
  ){

    clusters.push(
      current
    );

  }


  const html =

    clusters

      .slice(0,5)

      .map(cluster => {

        const first =
          cluster[0];


        return `

          <div style="
            margin-bottom:16px;
            padding-bottom:12px;
            border-bottom:1px solid #334155;
          ">

            <div style="
              color:#22c55e;
              font-weight:bold;
              margin-bottom:8px;
            ">

              🕘 ${escapeHtml(first.time)}

              • ${cluster.length} boss

            </div>


            ${cluster
              .map(item => `

                <div>

                  • ${escapeHtml(item.boss)}

                  <span
                    style="opacity:.7">

                    (${escapeHtml(item.src)})

                  </span>

                </div>

              `)
              .join("")
            }


            <div
              class="small"
              style="margin-top:6px">

              Còn
              ${Math.max(
                0,
                Math.floor(
                  first.min
                )
              )}
              phút

            </div>

          </div>

        `;

      })

      .join("");


  box.style.display =
    "block";


  box.innerHTML = `

    <h3 style="margin-top:0">

      📅 Các đợt boss tiếp theo

    </h3>

    ${html}

  `;

}


/* =====================================================
   RENDER
====================================================== */

function render(data){

  const tb =
    document.getElementById(
      "tb"
    );


  data.forEach(item => {

    item.min =
      getCurrentMinutes(
        item
      );

  });


  const sorted =

    [...data]

      .sort(
        (a,b) =>
          a.min - b.min
      );


  const filtered =

    sorted.filter(item => {

      if(
        !visibleSources[
          item.sheet
        ]
      ){

        return false;

      }


      return (

        item.min <= 30

        &&

        item.min >= -1

      );

    });


  tb.innerHTML =
    "";


  /* =================================================
     TABLE
  ================================================= */

  filtered.forEach(item => {

    const tr =
      document.createElement(
        "tr"
      );


    if(
      item.min <= 1
    ){

      tr.classList.add(
        "highlight"
      );

    }


    const server =
      item.server ||
      item.src ||
      "";


    tr.innerHTML = `

      <td>
        ${escapeHtml(item.boss)}
      </td>

      <td>
        ${escapeHtml(item.map)}
      </td>

      <td>

        ${escapeHtml(item.time)}

        <div class="small">

          ${
            item.min >= 0
              ? Math.floor(item.min)
              : 0
          }
          phút

        </div>

      </td>

      <td>
        ${escapeHtml(server)}
      </td>

    `;


    tb.appendChild(tr);

  });


  /* =================================================
     READY
  ================================================= */

  const ready =

    filtered.filter(
      item =>
        item.min <= 1
    );


  if(
    ready.length
  ){

    console.log(
      "READY BOSSES:",
      ready
    );

  }


  /* =================================================
     CLUSTER
  ================================================= */

  const clusters = [];

  let current = [];


  for(
    let i = 0;
    i < filtered.length;
    i++
  ){

    if(
      current.length === 0
    ){

      current.push(
        filtered[i]
      );

      continue;

    }


    const prev =
      current[
        current.length - 1
      ];


    if(

      Math.abs(
        filtered[i].min -
        prev.min
      ) <= 2

    ){

      current.push(
        filtered[i]
      );

    }else{

      clusters.push(
        current
      );


      current = [
        filtered[i]
      ];

    }

  }


  if(
    current.length
  ){

    clusters.push(
      current
    );

  }


  /* =================================================
     MULTI
  ================================================= */

  const activeMulti =

    clusters.find(cluster => {

      return (

        cluster.length >= 2

        &&

        cluster.some(
          item =>
            item.min <= 1
        )

      );

    });


  if(
    activeMulti
  ){

    console.log(
      "MULTI:",
      activeMulti
    );


    const multiKey =

      activeMulti

        .map(item =>

          item.sheet +
          "|" +
          item.boss +
          "|" +
          item.time

        )

        .sort()

        .join("||");


    const now =
      Date.now();


    if(

      !lastMultiAlert.has(
        multiKey
      )

      &&

      now -
      lastMultiTime >
      10000

    ){

      playSound(
        "multi"
      );


      lastMultiTime =
        now;


      lastMultiAlert.add(
        multiKey
      );


      activeMulti.forEach(
        item => {

          lastAlert.add(

            item.sheet +
            "|" +
            item.boss +
            "|" +
            item.time

          );

        }
      );

    }


  }else{


    /* =================================================
       SINGLE
    ================================================= */

    ready.forEach(item => {

      const key =

        item.sheet +
        "|" +
        item.boss +
        "|" +
        item.time;


      if(
        lastAlert.has(key)
      ){

        return;

      }


      lastAlert.add(
        key
      );


      if(
        item.isInvasion
      ){

        playSound(
          "l2_invasion"
        );

      }else{

        playSound(
          "l2"
        );

      }

    });

  }


  /* =================================================
     RECOMMENDATION
  ================================================= */

  renderRecommendation(
    data
  );


  /* =================================================
     EMPTY
  ================================================= */

  if(
    filtered.length === 0
  ){

    tb.innerHTML = `

      <tr>

        <td
          colspan="4"
          style="
            text-align:center;
            opacity:.6;
          "
        >

          Không có boss nào
          trong 30 phút tới

        </td>

      </tr>

    `;

  }

}

/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
   EXTRACT SPREADSHEET ID
====================================================== */

function extractSpreadsheetId(
  url
){

  if(!url)
    return null;


  const match =
    url.match(
      /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
    );


  if(match){

    return match[1];

  }


  /*
   * Cho phép nhập trực tiếp ID
   */
  if(
    /^[a-zA-Z0-9-_]{20,}$/
      .test(
        url.trim()
      )
  ){

    return url.trim();

  }


  return null;

}


/* =====================================================
   BUILD OPENSHEET URL
====================================================== */

function buildOpenSheetUrl(
  url,
  tab
){

  const id =
    extractSpreadsheetId(
      url
    );


  if(!id){

    throw new Error(
      "Link Google Sheet không hợp lệ"
    );

  }


  if(!tab){

    throw new Error(
      "Chưa nhập thứ tự hoặc tên Tab"
    );

  }


  return (

    "https://opensheet.elk.sh/" +

    encodeURIComponent(id) +

    "/" +

    encodeURIComponent(
      tab
    )

  );

}


/* =====================================================
   FETCH OPEN SHEET
====================================================== */

async function fetchOpenSheet(
  url,
  tab
){

  const apiUrl =
    buildOpenSheetUrl(
      url,
      tab
    );


  const res =
    await fetchWithTimeout(

      apiUrl,

      {},

      API_TIMEOUT

    );


  if(!res.ok){

    throw new Error(
      "OpenSheet HTTP " +
      res.status
    );

  }


  const json =
    await res.json();


  if(
    !Array.isArray(json)
  ){

    throw new Error(
      "Sheet không trả về dữ liệu dạng bảng"
    );

  }


  return json;

}


/* =====================================================
   NORMALIZE HEADER
====================================================== */

function normalizeHeader(
  value
){

  return String(value || "")
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .trim();

}


/* =====================================================
   PARSE TIME
   HỖ TRỢ:

   23:30
   23:30:00
   23h30
   23.30
   23-30
====================================================== */

function parseExternalTime(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return null;

  }


  let text =
    String(value)
      .trim();


  if(!text)
    return null;


  /*
   * 23h30
   * 23 h 30
   */
  text =
    text.replace(
      /(\d{1,2})\s*h\s*(\d{1,2})/gi,
      "$1:$2"
    );


  /*
   * 23.30
   * 23-30
   */
  text =
    text.replace(
      /\b(\d{1,2})[.-](\d{2})(?:[.:](\d{2}))?\b/g,
      "$1:$2"
    );


  /*
   * Tìm HH:MM hoặc HH:MM:SS
   */
  const match =
    text.match(
      /\b(\d{1,2}):(\d{2})(?::(\d{2}))?\b/
    );


  if(!match)
    return null;


  const hour =
    Number(match[1]);


  const minute =
    Number(match[2]);


  const second =
    Number(
      match[3] || 0
    );


  if(

    hour < 0 ||
    hour > 23 ||

    minute < 0 ||
    minute > 59 ||

    second < 0 ||
    second > 59

  ){

    return null;

  }


  return {

    hour,
    minute,
    second

  };

}


/* =====================================================
   PARSE DATE
   HỖ TRỢ:

   DD/MM/YYYY
   DD-MM-YYYY
   YYYY-MM-DD
====================================================== */

function parseExternalDate(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return null;

  }


  const text =
    String(value)
      .trim();


  if(!text)
    return null;


  /*
   * DD/MM/YYYY
   * DD-MM-YYYY
   */
  let match =
    text.match(
      /\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\b/
    );


  if(match){

    return {

      day:
        Number(match[1]),

      month:
        Number(match[2]),

      year:
        Number(match[3])

    };

  }


  /*
   * YYYY-MM-DD
   */
  match =
    text.match(
      /\b(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\b/
    );


  if(match){

    return {

      day:
        Number(match[3]),

      month:
        Number(match[2]),

      year:
        Number(match[1])

    };

  }


  return null;

}


/* =====================================================
   BUILD EXTERNAL TIMESTAMP

   Nếu Time = 23:30
   → dùng hôm nay

   Nếu 23:30 đã qua
   → dùng ngày mai

   Nếu có ngày + giờ
   → dùng ngày đó
====================================================== */

function buildExternalTimestamp(
  value
){

  const text =
    String(value || "")
      .trim();


  if(!text)
    return null;


  const time =
    parseExternalTime(
      text
    );


  if(!time)
    return null;


  const date =
    parseExternalDate(
      text
    );


  /*
   * Có ngày cụ thể
   */
  if(date){

    const timestamp =
      new Date(

        date.year,
        date.month - 1,
        date.day,

        time.hour,
        time.minute,
        time.second

      ).getTime();


    if(
      Number.isNaN(timestamp)
    ){

      return null;

    }


    return timestamp;

  }


  /*
   * Chỉ có giờ/phút
   */
  const now =
    new Date();


  let timestamp =
    new Date(

      now.getFullYear(),
      now.getMonth(),
      now.getDate(),

      time.hour,
      time.minute,
      time.second

    ).getTime();


  /*
   * Nếu giờ đã qua,
   * chuyển sang ngày mai.
   *
   * Cho phép sai lệch nhỏ 1 phút
   * để tránh nhảy ngày khi đúng thời điểm.
   */
  if(
    timestamp <
    Date.now() - 60000
  ){

    timestamp +=
      24 *
      60 *
      60 *
      1000;

  }


  return timestamp;

}


/* =====================================================
   FORMAT EXTERNAL TIME
====================================================== */

function formatExternalTime(
  timestamp
){

  if(!timestamp)
    return "";


  return new Date(
    timestamp
  ).toLocaleTimeString(
    "vi-VN",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}

/* =====================================================
   NORMALIZE EXTERNAL ROWS
====================================================== */

function normalizeExternalRows(
  config,
  rows
){

  const data = [];


  if(
    !Array.isArray(rows)
  ){

    return data;

  }


  rows.forEach(row => {

    const boss =
        String(
          row[
            config.columns.boss
          ] ?? ""
        ).trim();
      
      if(
        Array.isArray(
          config.selectedBosses
        ) &&
        config.selectedBosses.length > 0
      ){
      
        const selected =
          config.selectedBosses.some(
            selectedBoss =>
      
              normalizeHeader(
                selectedBoss
              ) ===
      
              normalizeHeader(
                boss
              )
          );
      
      
        if(!selected){
      
          return;
      
        }
      
      }

    const map =
      String(
        row[
          config.columns.map
        ] ?? ""
      ).trim();


    const timeValue =
      String(
        row[
          config.columns.time
        ] ?? ""
      ).trim();


    if(!boss)
      return;


    if(!timeValue)
      return;


    /*
     * Bỏ dòng tiêu đề lặp lại
     */
    if(
      normalizeHeader(boss) ===
      normalizeHeader(
        config.columns.boss
      )
    ){

      return;

    }


    const timestamp =
      buildExternalTimestamp(
        timeValue
      );


    if(!timestamp)
      return;


    data.push({

      boss:
        normalizeBoss(
          boss
        ),

      isInvasion:
        isInvasionBoss(
          boss
        ),

      map:
        map,

      time:
        formatExternalTime(
          timestamp
        ),

      src:
        config.name,

      sheet:
        config.name,

      server:
        config.server,

      bossTimestamp:
        timestamp,

      external:
        true

    });

  });


  return data;

}


/* =====================================================
   LOAD ONE EXTERNAL SHEET
====================================================== */

async function loadExternalSheet(
  config
){

  const rows =
    await fetchOpenSheet(

      config.url,

      config.tab

    );


  return normalizeExternalRows(
    config,
    rows
  );

}


/* =====================================================
   LOAD ALL EXTERNAL SHEETS
====================================================== */

async function loadAllExternalSheets(){

  if(
    !externalSheets.length
  ){

    externalData =
      [];

    renderCurrentData();

    return;

  }


  const newData = [];


  for(
    const config
    of externalSheets
  ){

    if(
      !config.enabled
    ){

      continue;

    }


    try{

      const data =
        await loadExternalSheet(
          config
        );


      newData.push(
        ...data
      );


      console.log(
        "External Sheet OK:",
        config.name,
        data
      );


    }catch(err){

      console.error(

        "External Sheet ERROR:",

        config.name,

        err

      );

      /*
       * Nếu Sheet lỗi,
       * giữ dữ liệu cũ của server đó.
       */
      const oldData =
        externalData.filter(
          item =>
            item.sheet ===
            config.name
        );


      newData.push(
        ...oldData
      );

    }

  }


  externalData =
    newData;


  renderCurrentData();

}


/* =====================================================
   RENDER EXTERNAL SERVERS
====================================================== */

function renderExternalServers(){

  const box =
    document.getElementById(
      "externalServers"
    );


  if(
    !externalSheets.length
  ){

    box.innerHTML =
      "";

    return;

  }


  /*
   * Tạo filter cho server đã lưu.
   */
  externalSheets.forEach(
    config => {

      addSourceFilter(
        config.name
      );

    }
  );


  box.innerHTML = `

    <div style="
      font-weight:bold;
      margin-bottom:8px;
    ">

      🖥️ Server đang kết nối

    </div>

  `;


  externalSheets.forEach(
    config => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "external-server";


      div.innerHTML = `

        <div
          class="external-server-header">

          <input
            type="checkbox"
            ${
              config.enabled
                ? "checked"
                : ""
            }
            onchange="
              toggleExternalServer(
                ${config.id}
              )
            "
          >


          <div
            class="external-server-name">

            ${escapeHtml(
              config.name
            )}

            <div
              class="small">

              Tab:
              ${escapeHtml(
                config.tab
              )}

            </div>

          </div>


          <div
            class="external-actions">

            <button
              class="btn-secondary"
              onclick="
                editExternalServer(
                  ${config.id}
                )
              "
            >

              ⚙

            </button>


            <button
              class="btn-danger"
              onclick="
                removeExternalServer(
                  ${config.id}
                )
              "
            >

              ✕

            </button>

          </div>

        </div>

      `;


      box.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   TOGGLE EXTERNAL SERVER
====================================================== */

function toggleExternalServer(
  id
){

  const config =
    externalSheets.find(
      item =>
        item.id === id
    );


  if(!config)
    return;


  config.enabled =
    !config.enabled;


  visibleSources[
    config.name
  ] =
    config.enabled;


  saveExternalSheets();


  loadAllExternalSheets();

}


/* =====================================================
   EDIT EXTERNAL SERVER
====================================================== */

async function editExternalServer(
  id
){

  const config =
    externalSheets.find(
      item =>
        item.id === id
    );


  if(!config)
    return;


  try{

    setAPIStatus(
      "🔄 Đang đọc Sheet để chỉnh cấu hình...",
      "loading"
    );


    const rows =
      await fetchOpenSheet(
        config.url,
        config.tab
      );


    if(!rows.length){

      throw new Error(
        "Sheet không có dữ liệu"
      );

    }


    pendingExternalSheet = {

      url:
        config.url,

      tab:
        config.tab,

      rows:
        rows,

      headers:
        Object.keys(
          rows[0]
        ),
      selectedBosses:
        config.selectedBosses || null
    };


    showExternalMapping(
      pendingExternalSheet,
      config
    );


    setAPIStatus(
      "🟢 Đã đọc Sheet",
      "ok"
    );


  }catch(err){

    console.error(err);


    alert(
      "Không thể đọc Sheet:\n" +
      err.message
    );

  }

}


/* =====================================================
   REMOVE EXTERNAL SERVER
====================================================== */

function removeExternalServer(
  id
){

  const config =
    externalSheets.find(
      item =>
        item.id === id
    );


  if(!config)
    return;


  if(
    !confirm(
      "Xóa " +
      config.name +
      " khỏi Boss Timer?"
    )
  ){

    return;

  }


  externalSheets =
    externalSheets.filter(
      item =>
        item.id !== id
    );


  externalData =
    externalData.filter(
      item =>
        item.sheet !==
        config.name
    );


  removeSourceFilter(
    config.name
  );


  saveExternalSheets();


  renderExternalServers();


  renderCurrentData();

}


/* =====================================================
   LOCAL COUNTDOWN - 1 SECOND
====================================================== */

setInterval(() => {

  updateLocalTime();

},1000);


/* =====================================================
   WORKER
====================================================== */

const worker =
  new Worker(
    "timer-worker.js"
  );


worker.onmessage =
  async (e) => {

    if(
      e.data.type === "tick"
    ){

      console.log(
        "worker tick:",
        new Date()
          .toLocaleTimeString()
      );


      await syncAPI();


      /*
       * Đồng bộ Sheet ngoài
       */
      await loadAllExternalSheets();

    }

  };


worker.postMessage(
  "start"
);


/* =====================================================
   VISIBILITY CHANGE
====================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    console.log(
      "visibility:",
      document.hidden
    );


    if(
      !document.hidden
    ){

      updateLocalTime();

      syncAPI();

      loadAllExternalSheets();

    }

  }
);


/* =====================================================
   AUTO LOGIN
====================================================== */

if(TOKEN){

  showApp();

}


/* =====================================================
   INITIAL EXTERNAL FILTER
====================================================== */

externalSheets.forEach(
  config => {

    visibleSources[
      config.name
    ] =
      config.enabled;

  }
);


console.log(
  "Boss Timer L2 loaded"
);

</script>
