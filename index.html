<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Boss Timer Realtime</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:10px;
}

h2{
  text-align:center;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  margin:10px 0;
  background:#3b82f6;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.filter-btn{
  flex:1;
  background:#1e293b;
}

.filter-btn.active{
  background:#22c55e;
  color:#000;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #334155;
  font-size:14px;
}

tr:nth-child(even){
  background:#1e293b;
}

.highlight{
  background:#22c55e !important;
  color:#000;
  font-weight:bold;
}

.small{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body onclick="unlockSound()">

<h2>🔥 Boss Timer (L2 + L9)</h2>

<button onclick="unlockSound(); playSound('l2')">
  🔊 Test Sound
</button>

<div class="filters">

  <button class="filter-btn active"
          id="btnL2"
          onclick="toggleSource('L2')">
    ✓ L2
  </button>

  <button class="filter-btn active"
          id="btnL9"
          onclick="toggleSource('L9')">
    ✓ L9
  </button>

</div>

<table>
<thead>
<tr>
  <th>Boss</th>
  <th>Map</th>
  <th>Time</th>
  <th>Server</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<div id="recommendBox"
     style="
     margin-top:15px;
     padding:15px;
     background:#1e293b;
     border-radius:10px;
     display:none;
     ">
</div>

<script>

/* ================= API ================= */
const SCRIPT =
"https://script.google.com/macros/s/AKfycby1fqig_C-nMEVuWjizWBfjSgo8hRUp-uA8SVTYMLmjcc_t4XpTeHTgJ9GkDVH4dYqWrA/exec";

const L2_URL =
`${SCRIPT}?id=1aMa0D7f5g8Gv1vtiGdnG3e5z_RghB4Pe4ydAh3X-WUw&sheet=L2TimeBoss`;

const L9_URL =
`${SCRIPT}?id=1k0zPKusyN-mz1MGafsOx8duzqi5PAnU8v9FPNF_BK2Y&sheet=L9TimeBoss`;
  
/* ================= SOUND ================= */

const SOUNDS = {
  l2: new Audio("sounds/l2.mp3"),
  l2_invasion: new Audio("sounds/l2_invasion.mp3"),

  l9: new Audio("sounds/l9.mp3"),
  l9_invasion: new Audio("sounds/l9_invasion.mp3"),

  multi: new Audio("sounds/multi.mp3")
};

let soundUnlocked = false;
let lastPlay = 0;
let lastMultiTime = 0;

/* unlock audio */
function unlockSound(){
  if(soundUnlocked) return;

  Object.values(SOUNDS).forEach(s=>{
    s.play().then(()=>{
      s.pause();
      s.currentTime = 0;
    }).catch(()=>{});
  });

  soundUnlocked = true;
}

/* anti spam */
function canPlay(){
  const now = Date.now();
  if(now - lastPlay < 2000) return false;
  lastPlay = now;
  return true;
}

/* play */
function playSound(type){

  console.log(
  "PLAY REQUEST",
  type,
  new Date().toLocaleTimeString(),
  "hidden:",
  document.hidden
  );
  if(!canPlay()) return;

  unlockSound();

  const audio = SOUNDS[type];
  if(!audio) return;

  audio.pause();
  audio.currentTime = 0;

  audio.play()
  .then(() => {
    console.log("play ok:", type);
  })
  .catch(err => {
    console.error("play fail:", type, err);
  });
}

function toggleSource(src){

  visibleSources[src] = !visibleSources[src];

  const btn = document.getElementById("btn" + src);

  btn.classList.toggle("active", visibleSources[src]);

  btn.innerText =
    (visibleSources[src] ? "✓ " : "✕ ") + src;

  loop();
}

/* ================= STATE ================= */

let lastAlert = new Set();
let lastMultiAlert = new Set();

let visibleSources = {
  L2: true,
  L9: true
};

setInterval(() => {
  lastAlert.clear();
  lastMultiAlert.clear();
}, 86400000);

/* ================= TIME ================= */

function getMinutes(row){

  const check = row["check"];

  if(!check) return 999999;

  const [datePart, timePart] = check.trim().split(" ");

  const [day, month, year] = datePart.split("/").map(Number);
  const [hour, minute, second] = timePart.split(":").map(Number);

  const bossTime = new Date(
    year,
    month - 1,
    day,
    hour,
    minute,
    second || 0
  );

  return (bossTime - new Date()) / 60000;
}

/* ================= CLEAN ================= */

function normalizeBoss(b){
  return (b || "")
    .replace(" - K9","")
    .trim();
}

function isInvasionBoss(name){
  return (name || "").trim().startsWith("XL-");
}

/* ================= FETCH ================= */

async function fetchData(){

  const [l2,l9] = await Promise.all([
    fetch(L2_URL).then(r=>r.json()),
    fetch(L9_URL).then(r=>r.json())
  ]);

  const data = [];

function getTimeBoss(row){

  const value =
      row["TIME BOSS"]
      || row["TIMEBOSS"]
      || row["TIME"]
      || row[""];

  if(
    value &&
    /^\d{1,2}:\d{2}:\d{2}$/.test(value)
  ){
    return value;
  }

  return null;
}

  l2.forEach(i=>{

    const timeBoss = getTimeBoss(i);

    if(timeBoss && !timeBoss.includes("#")){
      data.push({
        boss:normalizeBoss(i.BOSS),
        isInvasion:isInvasionBoss(i.BOSS),
        map:i.MAP,
        time:timeBoss,
        src:"L2",
        sheet:"L2",
        min:getMinutes(i)
      });
    }
  });

  l9.forEach(i=>{

    const timeBoss = getTimeBoss(i);

    if(timeBoss && !timeBoss.includes("#")){
      data.push({
        boss:normalizeBoss(i.BOSS),
        isInvasion:isInvasionBoss(i.BOSS),
        map:i.MAP,
        time:timeBoss,
        src:"L9",
        sheet:"L9",
        min:getMinutes(i)
      });
    }
  });

  return data;
}

/* ================= RENDER ================= */

function renderRecommendation(data){

  const box = document.getElementById("recommendBox");

  const future = data
    .filter(i =>
      visibleSources[i.sheet] &&
      i.min > 30
    )
    .sort((a,b)=>a.min-b.min);

  if(future.length===0){
    box.style.display="none";
    return;
  }

  // Gom boss thành từng đợt (cluster)
  const clusters=[];

  let current=[];

  future.forEach(boss=>{

    if(current.length===0){
      current.push(boss);
      return;
    }

    const prev=current[current.length-1];

    if(Math.abs(prev.min-boss.min)<=2){
      current.push(boss);
    }else{
      clusters.push(current);
      current=[boss];
    }

  });

  if(current.length){
    clusters.push(current);
  }

  // Chỉ hiện 5 đợt gần nhất
  const html=clusters.slice(0,5).map(cluster=>{

    const first=cluster[0];

    const remain=Math.floor(first.min);

    return `

      <div style="
        margin-bottom:16px;
        padding-bottom:12px;
        border-bottom:1px solid #334155;
      ">

        <div style="
          color:#22c55e;
          font-weight:bold;
          margin-bottom:8px;
        ">
          🕘 ${first.time}
          • ${cluster.length} boss
        </div>

        ${cluster.map(i=>`
          <div>
            • ${i.boss}
            <span style="opacity:.7">
              (${i.sheet})
            </span>
            
          </div>
          
        `).join("")}
        
        <div class="small"
             style="margin-top:6px">
          Còn ${Math.floor(first.min)} phút
        </div>

      </div>

    `;

  }).join("");

  box.style.display="block";

  box.innerHTML=`
      <h3 style="margin-top:0">
        📅 Các đợt boss tiếp theo
      </h3>

      ${html}
  `;

}

function render(data){

  data.sort((a,b)=>a.min-b.min);

  const tb = document.getElementById("tb");
  tb.innerHTML = "";

  const filtered = data.filter(i => {

  if(!visibleSources[i.sheet]){
    return false;
  }

  return i.min <= 30 && i.min >= -1;
});
 // const alertBosses = [];

  filtered.forEach(i=>{
/*
    if(i.min <= 1){
      const key = i.sheet + i.boss + i.time;

      if(!lastAlert.has(key)){
        alertBosses.push(i);
      }
    }
*/
    const tr = document.createElement("tr");

    if(i.min <= 1 || i.multi){
      tr.classList.add("highlight");
    }

    tr.innerHTML = `
      <td>${i.boss}</td>
      <td>${i.map}</td>
      <td>${i.time}
        <div class="small">${Math.floor(i.min)} phút</div>
      </td>
      <td>${i.src}</td>
    `;

    tb.appendChild(tr);
  });

/* ================= SOUND LOGIC ================= */

const ready = filtered.filter(i => i.min <= 1);

/*log debug*/
if (ready.length) {
  console.log("READY BOSSES", ready);
}  
  
const sorted = [...filtered].sort((a,b)=>a.min-b.min);

let clusters = [];
let current = [];

for(let i=0;i<sorted.length;i++){

  if(current.length === 0){
    current.push(sorted[i]);
    continue;
  }

  const prev = current[current.length - 1];

  if(Math.abs(sorted[i].min - prev.min) <= 2){
    current.push(sorted[i]);
  }else{
    clusters.push(current);
    current = [sorted[i]];
  }
}

if(current.length){
  clusters.push(current);
}

const activeMulti = clusters.find(c =>
  c.length >= 2 &&
  c.some(i => i.min <= 1)
);

/* ================= MULTI ================= */


if(activeMulti){

  console.log("MULTI", activeMulti);

  const multiKey = activeMulti
    .map(i =>
      i.sheet + i.boss + i.time
    )
    .sort()
    .join("|");

  const now = Date.now();

  if(
    !lastMultiAlert.has(multiKey)
    &&
    now - lastMultiTime > 10000
  ){

    playSound("multi");

    lastMultiTime = now;

    lastMultiAlert.add(multiKey);

    activeMulti.forEach(i=>{

      lastAlert.add(
        i.sheet + i.boss + i.time
      );

    });

  }

  return;
}

/* ================= SINGLE ================= */

else{

  ready.forEach(i=>{

    const key = i.sheet + i.boss + i.time;

    if(lastAlert.has(key)) return;

    lastAlert.add(key);

if(i.sheet === "L2"){

  if(i.isInvasion){
    playSound("l2_invasion");
  }else{
    playSound("l2");
  }

}
else{

  if(i.isInvasion){
    playSound("l9_invasion");
  }else{
    playSound("l9");
  }

}

  });
}
  renderRecommendation(data);
  
  if(filtered.length === 0){
    tb.innerHTML = `
      <tr>
        <td colspan="4" style="text-align:center;opacity:0.6">
          Không có boss nào trong 30 phút tới
        </td>
      </tr>
    `;
  }
}

/* ================= DEBUG ================= */

document.addEventListener(
  "visibilitychange",
  () => {

    console.log(
      "visibility:",
      document.hidden
    );

    if (!document.hidden) {
      loop();
    }
  }
);

/* ================= LOOP ================= */

async function loop(){
  try{
    unlockSound();
    const data = await fetchData();
    render(data);
  }catch(e){
    console.error(e);
  }
}

loop();
// setInterval(loop,10000);
  
const worker = new Worker("timer-worker.js");

worker.onmessage = async (e) => {

  if (e.data.type === "tick") {

    console.log(
      "worker tick",
      new Date().toLocaleTimeString(),
      "hidden:",
      document.hidden
    );

    await loop();

  }

};

worker.postMessage("start");

console.log("script loaded");

  
</script>

</body>
</html>
