<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Boss Timer Realtime</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:10px;
}

h2{
  text-align:center;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  margin:10px 0;
  background:#3b82f6;
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #334155;
  font-size:14px;
}

tr:nth-child(even){
  background:#1e293b;
}

.highlight{
  background:#22c55e !important;
  color:#000;
  font-weight:bold;
}

.small{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body onclick="unlockSound()">

<h2>🔥 Boss Timer (L2 + L6)</h2>

<button onclick="unlockSound(); playSound('l2')">
  🔊 Test Sound
</button>

<table>
<thead>
<tr>
  <th>Boss</th>
  <th>Map</th>
  <th>Time</th>
  <th>Next</th>
  <th>Src</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<script>

/* ================= API ================= */

const L2_URL =
"https://opensheet.elk.sh/1nAxKZJJ-nqzNssMFjUYRJpO2riMhLAEgPFfPm114JFk/timeboss";

const L6_URL =
"https://opensheet.elk.sh/1k0zPKusyN-mz1MGafsOx8duzqi5PAnU8v9FPNF_BK2Y/Time%20Boss";

/* ================= SOUND ================= */

const SOUNDS = {
  l2: new Audio("sounds/l2.mp3"),
  l2_invasion: new Audio("sounds/l2_invasion.mp3"),

  l6: new Audio("sounds/l6.mp3"),
  l6_invasion: new Audio("sounds/l6_invasion.mp3"),

  multi: new Audio("sounds/multi.mp3")
};

let soundUnlocked = false;
let lastPlay = 0;

/* unlock audio */
function unlockSound(){
  if(soundUnlocked) return;

  Object.values(SOUNDS).forEach(s=>{
    s.play().then(()=>{
      s.pause();
      s.currentTime = 0;
    }).catch(()=>{});
  });

  soundUnlocked = true;
}

/* anti spam */
function canPlay(){
  const now = Date.now();
  if(now - lastPlay < 2000) return false;
  lastPlay = now;
  return true;
}

/* play */
function playSound(type){
  if(!canPlay()) return;

  unlockSound();

  const audio = SOUNDS[type];
  if(!audio) return;

  audio.pause();
  audio.currentTime = 0;

  audio.play().catch(()=>{});
}

/* ================= STATE ================= */

let lastAlert = new Set();
let lastMultiAlert = new Set();

setInterval(() => {
  lastAlert.clear();
}, 86400000);

/* ================= TIME ================= */

function getMinutes(timeStr){
  if(!timeStr || timeStr.includes("#")) return 999999;

  const [h,m,s] = timeStr.split(":").map(Number);

  const now = new Date();
  const d = new Date();

  d.setHours(h,m,s||0,0);

  return (d - now) / 60000;
}

/* ================= CLEAN ================= */

function normalizeBoss(b){
  return (b || "")
    .replace(" - K9","")
    .replace("XL-","")
    .trim();
}

/* ================= FETCH ================= */

async function fetchData(){

  const [l2,l6] = await Promise.all([
    fetch(L2_URL).then(r=>r.json()),
    fetch(L6_URL).then(r=>r.json())
  ]);

  const data = [];

  l2.forEach(i=>{
    if(i.TIMEBOSS && !i.TIMEBOSS.includes("#")){
      data.push({
        boss:i.BOSS,
        map:i.MAP,
        time:i.TIMEBOSS,
        next:i["TIME\nKẾ TIẾP"],
        src:"L2",
        sheet:"L2",
        min:getMinutes(i.TIMEBOSS)
      });
    }
  });

  l6.forEach(i=>{
    if(i.TIME && !i.TIME.includes("#")){
      data.push({
        boss:normalizeBoss(i.BOSS),
        map:i.MAP,
        time:i.TIME,
        next:i["TIME\nKẾ TIẾP"],
        src:"L6",
        sheet:"L6",
        min:getMinutes(i.TIME)
      });
    }
  });

  return data;
}

/* ================= RENDER ================= */

function render(data){

  data.sort((a,b)=>a.min-b.min);

  const tb = document.getElementById("tb");
  tb.innerHTML = "";

  const filtered = data.filter(i => i.min <= 30 && i.min >= -1);
  const alertBosses = [];

  filtered.forEach(i=>{

    if(i.min <= 1){
      const key = i.sheet + i.boss + i.time;

      if(!lastAlert.has(key)){
        alertBosses.push(i);
        lastAlert.add(key);
      }
    }

    const tr = document.createElement("tr");

    if(i.min <= 1 || i.multi){
      tr.classList.add("highlight");
    }

    tr.innerHTML = `
      <td>${i.boss}</td>
      <td>${i.map}</td>
      <td>${i.time}
        <div class="small">${Math.floor(i.min)} phút</div>
      </td>
      <td>${i.next || ""}</td>
      <td>${i.src}</td>
    `;

    tb.appendChild(tr);
  });

/* ================= SOUND LOGIC ================= */

const ready = filtered.filter(i => i.min <= 1);

const sorted = [...filtered].sort((a,b)=>a.min-b.min);

let clusters = [];
let current = [];

for(let i=0;i<sorted.length;i++){

  if(current.length === 0){
    current.push(sorted[i]);
    continue;
  }

  const prev = current[current.length - 1];

  if(sorted[i].min - prev.min <= 2){
    current.push(sorted[i]);
  }else{
    clusters.push(current);
    current = [sorted[i]];
  }
}

if(current.length){
  clusters.push(current);
}

const activeMulti = clusters.find(c =>
  c.length >= 2 &&
  c.some(i => i.min <= 1)
);

/* ================= MULTI ================= */

if(activeMulti){

  const anchor = activeMulti[0];

  const multiKey =
    anchor.sheet + anchor.boss + anchor.time;

  if(!lastMultiAlert.has(multiKey)){

    playSound("multi");
    lastMultiAlert.add(multiKey);

    activeMulti.forEach(i=>{
      lastAlert.add(i.sheet + i.boss + i.time);
    });
  }

}

/* ================= SINGLE ================= */

else{

  ready.forEach(i=>{

    const key = i.sheet + i.boss + i.time;

    if(lastAlert.has(key)) return;

    lastAlert.add(key);

    if(i.sheet==="L2" && i.src!=="L2"){
      playSound("l2_invasion");
    }
    else if(i.sheet==="L6" && i.src!=="L6"){
      playSound("l6_invasion");
    }
    else if(i.sheet==="L2"){
      playSound("l2");
    }
    else{
      playSound("l6");
    }

  });
}

  if(filtered.length === 0){
    tb.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center;opacity:0.6">
          Không có boss nào trong 30 phút tới
        </td>
      </tr>
    `;
  }
}

/* ================= LOOP ================= */

async function loop(){
  try{
    unlockSound();
    const data = await fetchData();
    render(data);
  }catch(e){
    console.error(e);
  }
}

loop();
setInterval(loop,10000);

</script>

</body>
</html>
